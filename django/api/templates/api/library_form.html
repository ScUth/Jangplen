<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% if library %}Update{% else %}Create{% endif %} Library</title>
    <style>
      body {font-family: Arial, sans-serif; padding: 20px; max-width: 760px; margin: auto;}
      label {display: block; margin-top: 12px; font-weight: 600;}
      input, select, textarea {width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 4px;}
      button {margin-top: 14px; padding: 10px 16px; background: #0077cc; color: white; border: none; border-radius: 4px; cursor: pointer;}
      .btn-secondary {background: #6c757d; margin-left: 8px;}
      .message {margin: 12px 0; padding: 10px; border-radius: 4px;}
      .success {background: #d4edda; color: #155724; border: 1px solid #c3e6cb;}
      .error {background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;}
    </style>
  </head>
  <body>
    <h1>{% if library %}Update{% else %}Create{% endif %} Library</h1>

    {% if success %}
    <div class="message success">{{ success }}</div>
    {% endif %}

    {% if error %}
    <div class="message error">{{ error }}</div>
    {% endif %}

    <form method="post">
      {% csrf_token %}

      <label for="id_name">Name *</label>
      <input type="text" id="id_name" name="name" value="{% if library %}{{ library.name }}{% endif %}" required />

      <label for="id_owner">Owner *</label>
      <select id="id_owner" name="owner" required>
        <option value="">Select an owner</option>
        {% for user in users %}
        <option value="{{ user.id }}" {% if library and library.owner.id == user.id %}selected{% endif %}>
          {{ user.display_name|default:user.username }} ({{ user.email }})
        </option>
        {% endfor %}
      </select>

      <label for="id_description">Description</label>
      <textarea id="id_description" name="description" rows="4">{% if library %}{{ library.description }}{% endif %}</textarea>

      <button type="submit">{% if library %}Update{% else %}Create{% endif %} Library</button>
      <a href="{% url 'library_list' %}" class="btn btn-secondary">Cancel</a>
    </form>

    {% if library %}
    <p><strong>Created:</strong> {{ library.created_at|date:"M d, Y H:i" }}</p>
    {% endif %}
  </body>
</html>
